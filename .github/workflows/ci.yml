name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  vectorgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release -- --workload w2 --n 5000 --setup-n 1000 --out /tmp/ci-w2
        working-directory: tools/vectorgen
      - run: test -s /tmp/ci-w2.run.cmd.jsonl && head -1 /tmp/ci-w2.run.cmd.jsonl | grep -q matcher-vector
